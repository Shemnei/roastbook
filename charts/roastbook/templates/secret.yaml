{{- if .Values.hodor.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "roastbook.fullname" . }}-hodor
  labels:
    {{- include "roastbook.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ required "hodor.password is required when hodor is enabled" .Values.hodor.password | quote }}
  secret: {{ .Values.hodor.secret | default (randAlphaNum 64) | quote }}
{{- end }}
---
{{- if not .Values.postgresql.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "roastbook.fullname" . }}-db
  labels:
    {{- include "roastbook.labels" . | nindent 4 }}
type: Opaque
stringData:
  url: {{ printf "postgresql://%s:%s@%s:%s/%s" .Values.postgresql.username (required "postgresql.password is required" .Values.postgresql.password) (required "postgresql.host is required" .Values.postgresql.host) .Values.postgresql.port .Values.postgresql.database | quote }}
{{- end }}
